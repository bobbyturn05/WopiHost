apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: wopi-host
  annotations:
    haproxy.router.openshift.io/timeout: 3m
spec:
  host: wopi.example.com
  path: /wopi
  to:
    kind: Service
    name: wopi-host
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
